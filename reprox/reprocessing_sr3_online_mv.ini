# SR3 online muon-veto reprocessing from stored raw_records_mv.
# Activate with REPROX_CONFIG before importing reprox or running its commands.

[context]
base_folder = /project/lgrandi/junyingh/sr3_mv/
destination_folder = /project/lgrandi/xenonnt/processed/
context = xenonnt_online
package = cutax
detector = muon_veto
context_kwargs = {"_rucio_local_path": "/project/lgrandi/rucio", "include_rucio_local": true, "_auto_append_rucio_local": false}
targets = events_mv
minimum_run_number = 87209
straxer_timeout_seconds = 2400
# Optional comma-separated exact RunDB mode names; empty means all modes.
run_mode =

[display]
progress_bar = True

[processing]
allowed_partitions = lgrandi
excluded_sources = kr-83m,th-232,neutron
ignore_patterns_in_logs = tensorflow,UserWarning,module compiled against
ram_multiplier_for_calibrations = 1.5
max_jobs = 20
logging_level = INFO
ram = 12000
cpus_per_job = 1
job_timeout_hours = 12
container_tag = el8.2026.09.2

[prerequisites]
required_from_osg_dtypes = raw_records_mv
