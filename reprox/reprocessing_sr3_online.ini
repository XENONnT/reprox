# SR3 online reprocessing from stored peaklets and lone_hits.
# Activate with REPROX_CONFIG before importing reprox or running its commands.

[context]
base_folder = /scratch/midway3/zhut/strax_data/sr3/
destination_folder = /scratch/midway3/zhut/strax_data/sr3/validated/
runs_to_do = to_do_runs.csv
context = xenonnt_online
package = cutax
context_kwargs = {"_rucio_local_path": "/project/lgrandi/rucio", "include_rucio_local": true, "_auto_append_rucio_local": false}
# Target for the runs included in this campaign.
targets = event_info
cmt_version = False
# RunDB applies this bound with >, so this selects runs above 87209.
minimum_run_number = 87209
maximum_run_number = None
straxer_timeout_seconds = 2400
include_detectors = tpc
storage_patches =
run_mode =

[display]
progress_bar = True
status_fig = ./status.png

[processing]
allowed_partitions = lgrandi
# Deliberate SR3 decision: do not finish Kr-83m runs in this campaign.
# Keep them in the progress table as skipped, even when a target is missing.
excluded_sources = kr-83m
ignore_patterns_in_logs = tensorflow,UserWarning,module compiled against
ram_multiplier_for_calibrations = 1.5
max_jobs = 100
logging_level = INFO
# Limit for the legacy reprox-start-jobs command, not online_processing.
# For a one-run online test, use --once --submit --max-submit-per-cycle 1.
submit_only = 1
ram = 8000
cpus_per_job = 1
job_timeout_hours = 8
container_tag = el8.2026.09.2

[prerequisites]
required_from_osg_dtypes = peaklets,lone_hits
